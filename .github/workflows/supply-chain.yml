name: Supply chain (SBOM + vulnerability scanning)

# Workstream-5 supply-chain hardening. Answers, per release:
#   "What exact dependencies are contained in this release?"
#   "Are there known critical/high vulnerabilities?"
# E-C: pip-audit and npm audit now GATE (no continue-on-error) - the
# baselines in requirements.lock / package-lock.json are clean, so any
# new known vulnerability fails the workflow. Findings remain uploaded
# as artifacts and triaged via docs/supply-chain/DEPENDENCY_AUDIT.md.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  python-audit:
    name: Python audit + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Install audit tooling
        run: python -m pip install "pip-audit>=2.7" "cyclonedx-bom>=7"
      - name: pip-audit (requirements.lock)
        id: pip-audit
        run: |
          mkdir -p test-artifacts/supply-chain
          python -m pip_audit -r requirements.lock --format=json --desc \
            | tee test-artifacts/supply-chain/pip-audit.json
      - name: Python SBOM (CycloneDX)
        run: |
          mkdir -p test-artifacts/supply-chain
          python -m cyclonedx_py requirements -i requirements.lock \
            --output-format JSON \
            --output-file test-artifacts/supply-chain/sbom-python.cyclonedx.json
          python -m pip freeze --exclude-editable \
            | tee test-artifacts/supply-chain/pip-freeze.txt
      - name: Upload Python supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-python
          path: test-artifacts/supply-chain/**
          if-no-files-found: warn
          retention-days: 90

  frontend-audit:
    name: Frontend audit + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: npm audit (JSON report)
        run: |
          mkdir -p ../test-artifacts/supply-chain
          npm audit --json | tee ../test-artifacts/supply-chain/npm-audit.json
      - name: Frontend SBOM (CycloneDX)
        run: |
          mkdir -p ../test-artifacts/supply-chain
          npm sbom --sbom-format cyclonedx --sbom-type library \
            | tee ../test-artifacts/supply-chain/sbom-frontend.cyclonedx.json
          npm ls --all --json | tee ../test-artifacts/supply-chain/npm-ls.json
      - name: Upload frontend supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-frontend
          path: test-artifacts/supply-chain/**
          if-no-files-found: warn
          retention-days: 90

  release-manifest:
    name: Release dependency manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [python-audit, frontend-audit]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build release dependency manifest
        run: |
          mkdir -p test-artifacts/supply-chain
          python scripts/supply-chain/build_release_manifest.py \
            --output test-artifacts/supply-chain/dependency-manifest.json
          cat test-artifacts/supply-chain/dependency-manifest.json
      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-manifest
          path: test-artifacts/supply-chain/dependency-manifest.json
          if-no-files-found: error
          retention-days: 90
