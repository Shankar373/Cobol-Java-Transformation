name: Supply chain (SBOM + vulnerability scanning)

# Workstream-5 supply-chain hardening. Answers, per release:
#   "What exact dependencies are contained in this release?"
#   "Are there known critical/high vulnerabilities?"
# E-C: pip-audit and npm audit now GATE (no continue-on-error) - the
# baselines in requirements.lock / package-lock.json are clean, so any
# new known vulnerability fails the workflow. Findings remain uploaded
# as artifacts and triaged via docs/supply-chain/DEPENDENCY_AUDIT.md.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

# Audit CI-F12: a newer push to a pull request supersedes its older run;
# pushes are grouped by commit so every pushed SHA keeps its own evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-audit:
    name: Python audit + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install audit tooling
        run: python -m pip install --require-hashes -r requirements-audit.lock
      - name: pip-audit (requirements.lock + requirements-dev.lock)
        id: pip-audit
        run: |
          # BL-143: default run shell is `bash -e` (no pipefail) — without
          # this the step exits with tee's status and audit findings can
          # never fail the gate.
          set -o pipefail
          mkdir -p test-artifacts/supply-chain
          python -m pip_audit -r requirements.lock --format=json --desc \
            | tee test-artifacts/supply-chain/pip-audit.json
          # Test tooling never ships (production installs requirements.lock
          # only) but runs in CI: it is audited too (audit D4 lock split).
          python -m pip_audit -r requirements-dev.lock --format=json --desc \
            | tee test-artifacts/supply-chain/pip-audit-dev.json
      - name: Python SBOM (CycloneDX)
        run: |
          set -o pipefail
          mkdir -p test-artifacts/supply-chain
          python -m cyclonedx_py requirements -i requirements.lock \
            --output-format JSON \
            --output-file test-artifacts/supply-chain/sbom-python.cyclonedx.json
          python -m cyclonedx_py requirements -i requirements-dev.lock \
            --output-format JSON \
            --output-file test-artifacts/supply-chain/sbom-python-dev.cyclonedx.json
          python -m pip freeze --exclude-editable \
            | tee test-artifacts/supply-chain/pip-freeze.txt
      - name: Upload Python supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-python
          path: test-artifacts/supply-chain/**
          if-no-files-found: warn
          retention-days: 90

  frontend-audit:
    name: Frontend audit + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: npm audit (JSON report)
        run: |
          # BL-143: pipefail (see python-audit) — npm audit findings must
          # fail this step, not be masked by tee's exit status.
          set -o pipefail
          mkdir -p ../test-artifacts/supply-chain
          npm audit --json | tee ../test-artifacts/supply-chain/npm-audit.json
      - name: Frontend SBOM (CycloneDX)
        run: |
          set -o pipefail
          mkdir -p ../test-artifacts/supply-chain
          npm sbom --sbom-format cyclonedx --sbom-type library \
            | tee ../test-artifacts/supply-chain/sbom-frontend.cyclonedx.json
          npm ls --all --json | tee ../test-artifacts/supply-chain/npm-ls.json
      - name: Upload frontend supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-frontend
          path: test-artifacts/supply-chain/**
          if-no-files-found: warn
          retention-days: 90

  release-manifest:
    name: Release dependency manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [python-audit, frontend-audit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build release dependency manifest
        run: |
          mkdir -p test-artifacts/supply-chain
          python scripts/supply-chain/build_release_manifest.py \
            --output test-artifacts/supply-chain/dependency-manifest.json
          cat test-artifacts/supply-chain/dependency-manifest.json
      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-manifest
          path: test-artifacts/supply-chain/dependency-manifest.json
          if-no-files-found: error
          retention-days: 90

  image-scan:
    # Phase 4 (2026-11-02): container images and the Java dependency tree.
    # pip-audit / npm audit cover the Python and npm locks only; this job
    # scans the three images the platform runs - OS packages, the Python
    # environment of the API image, and every jar in the offline Maven
    # repository (Spring Boot, Quarkus, Micronaut trees the generated
    # applications ship with). REPORT-ONLY: the generated framework versions
    # (Spring Boot 3.2.5, Quarkus 3.15.1, Micronaut 4.6.3) are past their
    # support windows and upgrading them is an owner decision with
    # generator + proof-corpus impact (docs/supply-chain/DEPENDENCY_AUDIT.md
    # J1/J3); making this a gate belongs to that decision. Findings are
    # uploaded as artifacts and printed in the log.
    name: Image + Java dependency scan (Trivy, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # aquasec/trivy:0.58.2 pinned by digest; the vulnerability DB is
      # downloaded fresh on every run.
      TRIVY_IMAGE: aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Build images
        run: |
          bash scripts/ci/build-image.sh Dockerfile.gnucobol gnucobol-ocesql:scan
          bash scripts/ci/build-image.sh Dockerfile.maven-offline maven-offline-springboot:scan
          bash scripts/ci/build-image.sh Dockerfile.production systemaops-api:scan
      - name: Scan images
        run: |
          mkdir -p test-artifacts/supply-chain/trivy
          for image in gnucobol-ocesql:scan maven-offline-springboot:scan systemaops-api:scan; do
            name="${image%%:*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v trivy-cache:/root/.cache/trivy \
              -v "$PWD/test-artifacts/supply-chain/trivy:/out" \
              "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL \
              --format json --output "/out/${name}.json" "$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL \
              --skip-db-update --format table "$image" || true
          done
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-image-scan
          path: test-artifacts/supply-chain/trivy/**
          if-no-files-found: error
          retention-days: 90
