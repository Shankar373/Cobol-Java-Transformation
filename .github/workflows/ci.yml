name: SystemaOps CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Audit CI-F12: a newer push to a pull request supersedes its older run;
# pushes are grouped by commit so every pushed SHA keeps its own evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  capability-truth:
    name: Capability truth gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install test runner only
        # This gate deliberately installs nothing from requirements.lock: it
        # guards capability truth, which must not depend on the runtime stack.
        # Keeping it dependency-free also proves the registry/analyzer/producer
        # surface has no hidden third-party coupling.
        run: python -m pip install --require-hashes -r requirements-gate.lock
      - name: Verify capability truth
        # Fast, Docker-free gate. The same invariants the backend Docker job
        # enforces, surfaced as their own job so a producer/registry
        # contradiction fails in ~1 minute instead of after the full
        # COBOL/Java image build (BL-012).
        run: |
          set -o pipefail
          # Note: tests/test_docker_capability_truth.py contains one API-layer
          # source-contract test (test_service_layer_probes_live_not_hardcoded)
          # that imports api.service, which requires pydantic. This gate
          # deliberately installs pytest only (BL-012 - no hidden runtime-stack
          # coupling), so that single test is deselected here and remains
          # enforced by the backend job, which runs the full suite. The same
          # applies to tests/test_oracle_entry_binding.py::TestServiceResolvesEntry.
          # The list lives in tests/capability_truth.txt (audit B3).
          python -m pytest -q $(grep -v '^#' tests/capability_truth.txt | grep -v '^$')
      - name: Dependency map is current
        # tools/dependency_map.py --check fails when docs/audits/DEPENDENCY_MAP.md
        # no longer matches the import graph (audit B3; it had gone stale).
        run: python tools/dependency_map.py --check

  capability-truth-windows:
    # Roadmap unit 19: the same Docker-free capability gate on Windows. Engineers and customers run the
    # control plane and the analysis on Windows; a path-separator, encoding or line-ending regression in the
    # registry, analyzer or producer surface must fail here, not at a customer. Only the pytest-only gate
    # runs (no Docker, no runtime stack): the Docker lanes stay on Linux.
    name: Capability truth gate (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 (the certified runtime; some tests compile generated Java on the host)
        # The runner's default JDK is older and rejects static members in inner classes, which Java 16+ allows.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install test runner only
        run: python -m pip install --require-hashes -r requirements-gate.lock
      - name: Verify capability truth
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q $(grep -v '^#' tests/capability_truth.txt | grep -v '^$' | tr -d '\r')

  lint:
    # Audit CI-F15: pyflakes (unused names, undefined names) and syntax
    # errors over the Python code; configuration in ruff.toml.
    name: Python lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install --require-hashes -r requirements-lint.lock
      - name: Lint
        run: ruff check .

  typecheck:
    # Roadmap unit 19: mypy as a ratchet (tools/mypy_gate.py). The errors that existed when the gate was
    # introduced are recorded in tests/mypy_baseline.txt; a new error fails, and so does a fixed one that is
    # still listed, so the baseline only shrinks. Code written for the enterprise roadmap must be type-clean.
    name: Python type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the project environment (mypy resolves imports against it)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install mypy
        run: python -m pip install --require-hashes -r requirements-typecheck.lock
      - name: Type check against the baseline
        run: python tools/mypy_gate.py --check

  coverage:
    # Roadmap unit 19: the Docker-free suite under coverage.py with a floor that may only rise.
    name: Test coverage floor
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install coverage
        run: python -m pip install --require-hashes -r requirements-coverage.lock
      - name: Run the suite under coverage
        shell: bash
        run: |
          set -o pipefail
          coverage run -m pytest -q tests
      - name: Enforce the coverage floor
        shell: bash
        run: |
          set -o pipefail
          coverage report --fail-under=88 | tee coverage-report.txt

  backend-hermetic:
    # Audit B2: the whole suite without Docker (RUN_DOCKER_TESTS unset), as a
    # developer runs it. Catches hermetic-only regressions the Docker lane
    # hides, and - with PytestWarning as an error - a stale entry in
    # tests/docker_lane.txt (conftest warns when an entry matches no test).
    name: Backend hermetic suite (no Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run the suite without Docker
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -W error::pytest.PytestWarning tests

  backend-hermetic-windows:
    # Roadmap unit 19: the whole Docker-free suite on Windows, as a Windows developer runs it. Two defects were
    # found this way: a non-ASCII character in generated Java that only failed under a non-UTF-8 default code
    # page, and a test that trusted the WSL launcher as bash. Docker lanes stay on Linux.
    name: Backend hermetic suite (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 (the certified runtime; some tests compile generated Java on the host)
        # The runner's default JDK is older and rejects static members in inner classes, which Java 16+ allows.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run the suite without Docker
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -W error::pytest.PytestWarning tests

  backend-oracle:
    name: Backend and COBOL/Java Docker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Build GnuCOBOL oracle image
        run: bash scripts/ci/build-image.sh Dockerfile.gnucobol gnucobol-ocesql:latest
      - name: Build GnuCOBOL linux/s390x lane image (QEMU, big-endian witness)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          docker build --platform linux/s390x -t gnucobol-s390x:local docker/gnucobol-s390x
          arch="$(docker run --rm --network none --platform linux/s390x gnucobol-s390x:local uname -m)"
          test "$arch" = "s390x" || { echo "expected s390x, got $arch" >&2; exit 1; }
          docker run --rm --network none --platform linux/s390x gnucobol-s390x:local cobc --version | head -1
      - name: Build OCESQL + PostgreSQL oracle image
        run: bash scripts/ci/build-image.sh Dockerfile.ocesql-pg ocesql-pg:latest
      - name: Build project Maven image
        run: bash scripts/ci/build-image.sh Dockerfile.maven-offline maven-offline-springboot:latest
      - name: Pull pinned Java execution image
        run: |
          RUNTIME_DIGEST="$(python -c 'from engine.candidate.docker_spring_boot_adapter import DockerSpringBootConfig; print(DockerSpringBootConfig().runtime_digest)')"
          docker pull "$RUNTIME_DIGEST"
          docker tag "$RUNTIME_DIGEST" eclipse-temurin:21-jdk
      - name: Record Docker image provenance
        run: |
          mkdir -p test-artifacts
          python scripts/record_docker_image_provenance.py \
            --build-image maven-offline-springboot:latest \
            --runtime-image eclipse-temurin:21-jdk \
            --output test-artifacts/docker-image-provenance.json
      - name: Record Docker image evidence
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          docker image inspect gnucobol-ocesql:latest maven-offline-springboot:latest eclipse-temurin:21-jdk > test-artifacts/docker-images.json
          docker run --rm --network none gnucobol-ocesql:latest cobc --version | tee test-artifacts/gnucobol-version.txt
          docker run --rm --network none eclipse-temurin:21-jdk java -version 2>&1 | tee test-artifacts/java-version.txt
          docker run --rm --network none maven-offline-springboot:latest mvn -version | tee test-artifacts/maven-version.txt
      - name: Install backend and test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run backend, oracle, and integration tests
        shell: bash
        env:
          RUN_DOCKER_TESTS: "1"
          VSAM_EVIDENCE_DIR: test-artifacts/vsam
        run: |
          set -o pipefail
          python -m pytest -ra --junitxml=test-artifacts/backend-junit.xml tests 2>&1 | tee test-artifacts/backend-tests.log
      - name: Require the VSAM Docker-lane proofs to have run (no skips)
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          required = ("test_vsam_api_to_java", "test_vsam_s390x_oracle", "test_vsam_java_consumer", "test_vsam_consumer_oracle")
          seen = {name: [0, 0] for name in required}  # executed, skipped
          for case in ET.parse("test-artifacts/backend-junit.xml").getroot().iter("testcase"):
              for name in required:
                  if name in case.get("classname", ""):
                      seen[name][0] += 1
                      seen[name][1] += any(child.tag == "skipped" for child in case)
          print(seen)
          bad = [n for n, (ran, skipped) in seen.items() if ran == 0 or skipped]
          sys.exit(f"VSAM lane proofs missing or skipped: {bad}" if bad else 0)
          PY
      - name: Upload backend logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-oracle-results
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 30

  frontend-windows:
    name: Frontend tests, TypeScript, and production build (Windows)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm test
      - name: Run TypeScript check and production build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build

  frontend:
    name: Frontend tests, TypeScript, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test-artifacts
          npm test -- --reporter=verbose 2>&1 | tee ../test-artifacts/frontend-tests.log
      - name: Run TypeScript check and production build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../test-artifacts/frontend-build.log
      - name: Upload frontend logs and build output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-results
          path: |
            test-artifacts/frontend-*.log
            frontend/dist/**
          if-no-files-found: warn
          retention-days: 30
