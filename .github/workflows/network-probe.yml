# Diagnostic only (runs when this file changes): which package-mirror hostnames resolve on a GitHub runner, from the
# host and from inside a container, and whether apt works through each. Added 2026-11-11 while archive.ubuntu.com /
# security.ubuntu.com / azure.archive.ubuntu.com failed to resolve during image builds. Remove when no longer needed.
name: Network probe
on:
  push:
    paths: [".github/workflows/network-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolver
        run: |
          cat /etc/resolv.conf || true
          resolvectl status 2>/dev/null | head -20 || true
      - name: Resolve from the host
        run: |
          for h in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com us.archive.ubuntu.com mirror.ubuntu.com mirrors.edge.kernel.org mirrors.kernel.org ftp.osuosl.org repo.maven.apache.org github.com; do
            if getent hosts "$h" >/dev/null 2>&1; then echo "host   OK   $h"; else echo "host   FAIL $h"; fi
          done
      - name: Resolve from a container (default bridge)
        run: |
          docker run --rm alpine:3.20 sh -c 'cat /etc/resolv.conf; for h in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com mirrors.edge.kernel.org ftp.osuosl.org repo.maven.apache.org; do if nslookup "$h" >/dev/null 2>&1; then echo "bridge OK   $h"; else echo "bridge FAIL $h"; fi; done' || true
      - name: apt update through each candidate mirror (container)
        run: |
          for m in archive.ubuntu.com azure.archive.ubuntu.com mirrors.edge.kernel.org; do
            echo "== $m"
            docker run --rm ubuntu:22.04 sh -c "sed -i -E 's#https?://(archive|security)\.ubuntu\.com#http://$m#g' /etc/apt/sources.list; apt-get update 2>&1 | tail -4; apt-cache policy libgmp-dev | head -3" || true
          done
