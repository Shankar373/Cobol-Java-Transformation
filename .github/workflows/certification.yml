name: Corpus certification (GnuCOBOL, all runtimes)

# Phase 5 (2026-11-02): re-derive the certification evidence on an exact
# commit, in CI instead of on a developer machine. For each proven runtime,
# in parallel: build the oracle and offline-Maven images, run every fixture
# application through the API (ingest -> generate -> offline build ->
# hardened execution -> comparison with GnuCOBOL), re-check every VERIFIED
# application with the independent verifier (shares no code with the
# platform), and fail unless every verdict equals the accepted evidence and
# every re-check AGREEs (scripts/e2e/certify_corpus.py).
#
# Manually dispatched for a release candidate (about an hour per runtime):
#   gh workflow run certification.yml --ref <branch>
# Not on every push - the regular CI already runs the oracle-pinned suites.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Certify ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runtime: [spring_boot, plain_java, quarkus, micronaut]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No job pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Build GnuCOBOL oracle image
        run: docker build --pull -f Dockerfile.gnucobol -t gnucobol-ocesql:latest .
      - name: Build project Maven image
        run: docker build --pull -f Dockerfile.maven-offline -t maven-offline-springboot:latest .
      - name: Pull pinned Java execution image
        run: |
          RUNTIME_DIGEST="$(python -c 'from engine.candidate.docker_spring_boot_adapter import DockerSpringBootConfig; print(DockerSpringBootConfig().runtime_digest)')"
          docker pull "$RUNTIME_DIGEST"
          docker tag "$RUNTIME_DIGEST" eclipse-temurin:21-jdk
      - name: Record Docker image provenance
        run: |
          mkdir -p test-artifacts
          python scripts/record_docker_image_provenance.py \
            --build-image maven-offline-springboot:latest \
            --runtime-image eclipse-temurin:21-jdk \
            --output test-artifacts/docker-image-provenance.json
      - name: Run the corpus through the API
        env:
          E2E_OUT: certification/e2e.jsonl
          E2E_TARGET: ${{ matrix.runtime }}
        run: |
          mkdir -p certification
          python scripts/e2e/run_fixture_apps.py 2>&1 | grep -E "^workload" | tee certification/e2e.log
      - name: Independent re-check of every VERIFIED application
        env:
          E2E_IN: certification/e2e.jsonl
          VERIFY_OUT: certification/independent.jsonl
        run: python scripts/e2e/verify_independent.py | tee certification/independent.log
      - name: Certify against the accepted evidence
        run: |
          python scripts/e2e/certify_corpus.py --runtime "${{ matrix.runtime }}" \
            --results certification/e2e.jsonl \
            --independent certification/independent.jsonl \
            --out-dir certification/evidence | tee certification/summary.txt
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certification-${{ matrix.runtime }}
          path: certification/**
          if-no-files-found: warn
          retention-days: 90
