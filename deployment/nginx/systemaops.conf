# TLS-terminating reverse proxy for the SystemaOps control plane.
#
# Assumptions (see docs/deployment/PRODUCTION.md):
#   * nginx listens on 443 ONLY — there is no port-80 server block, so
#     plaintext HTTP is refused rather than redirected-or-served.
#   * Certificates are mounted at /etc/nginx/tls/ (see compose file).
#     TLS 1.2+ only; HSTS is ALSO set by the FastAPI app itself.
#   * Frontend (frontend/dist build output) is served as static files when
#     FRONTEND_DIST_PATH is mounted; otherwise API-only mode still works.

upstream control_plane {
    server api:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;

    server_name _; # set explicit hostname via include / envsubst at your site

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Match the app's upload budgets: hard-fail oversized bodies at the edge
    # before they reach uvicorn. Keep in sync with
    # CONTROL_PLANE_MAX_REQUEST_BYTES (default 50m) in .env.production.
    client_max_body_size 50m;
    client_body_timeout 60s;

    # Defense in depth: the app sets these too (api/app.py
    # _SecurityHeadersMiddleware); the proxy re-asserts the framing ones.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness passthrough (unauthenticated upstream by design — used by
    # orchestrator probes; returns {"status":"ok"} only, no state).
    location = /health {
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        access_log off;
    }

    # API.
    location / {
        # Auth is enforced by the app (CONTROL_PLANE_API_TOKEN); the proxy
        # does not terminate or inspect Authorization.
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # modernize/validate runs are long-lived
        proxy_send_timeout 300s;
    }

    # Static frontend (present only when FRONTEND_DIST_PATH is mounted with
    # a production build). API routes take precedence via exact/prefix
    # matches above; everything else falls through to index.html.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }
}
