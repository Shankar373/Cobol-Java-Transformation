# SystemaOps Control Plane — production stack.
#
# Topology (single host, no HA — documented, not claimed):
#
#   Internet -> nginx (TLS termination, :443) -> api:8000 (uvicorn, 1 worker)
#                                                   |
#                        docker.sock + workspace volume -> sandbox containers
#                        (--network none, --memory/--cpus/--pids-limit,
#                         read-only mounts — enforced by engine code)
#
# Persistent state (named volumes — back these up):
#   * control-plane-data  -> /app/data        (SQLite control-plane.db)
#   * control-plane-work  -> /app/workspaces  (uploaded source / generated apps)
#
# Usage:
#   cp .env.production.example .env.production   # fill in secrets, never commit
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#   ./scripts/deploy/verify-production.sh

name: systemaops-production

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: systemaops-api:${IMAGE_TAG:-production}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      CONTROL_PLANE_DB: /app/data/control-plane.db
      TMPDIR: /app/tmp
      # Host-visible sandbox staging (R1 production execution topology).
      # The engine stages every Docker bind-mount source under
      # SANDBOX_STAGING_DIR (container view) and translates it to
      # SANDBOX_HOST_STAGING_DIR (host view) before building `docker run`
      # -v arguments, because bind sources are resolved by the HOST daemon.
      # Staging under the /app/tmp tmpfs or a named volume is invisible to
      # the host daemon, so oracle/candidate execution fails closed there.
      # The bind below makes both names the same directory. No new Docker
      # privileges are granted: the API keeps its existing caps, read-only
      # mounts, tmpfs scratch, no-new-privileges and network isolation.
      SANDBOX_STAGING_DIR: /app/sandbox-staging
      SANDBOX_HOST_STAGING_DIR: ${HOST_SANDBOX_STAGING_DIR:-/opt/systemaops/sandbox-staging}
    expose:
      - "8000"
    # No direct host port: all ingress goes through nginx (:443).
    volumes:
      - control-plane-data:/app/data
      - control-plane-work:/app/workspaces
      # Host-visible sandbox staging: HOST_SANDBOX_STAGING_DIR MUST be an
      # absolute host path (same value the engine translates to). The host
      # directory must exist and be writable by uid/gid 10001 (the API user)
      # — see scripts/deploy/start-production.sh, which prepares it.
      # /app/tmp stays a tmpfs (below), not a volume: non-sandbox scratch
      # only, gone on stop. Sandbox staging MUST NOT live on that tmpfs.
      - ${HOST_SANDBOX_STAGING_DIR:-/opt/systemaops/sandbox-staging}:/app/sandbox-staging
      # /app/tmp is a tmpfs (below), not a volume: scratch only, gone on stop.
      # Sandbox execution: the engine shells out to the host docker CLI,
      # so the API container needs the daemon socket. Privileged socket
      # access — risk accepted and mitigated per
      # docs/security/PRODUCTION_SECURITY.md. If your policy forbids it,
      # run the API directly on the Docker host instead of in a container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandbox images must exist on the HOST daemon (built by CI or
      # scripts/deploy/build-production.sh); they are not inside this image.
    # The API image runs as non-root uid/gid 10001, but the host daemon
    # socket is typically srw-rw---- root:<docker-gid>. Without this the
    # container CANNOT reach the daemon and the COBOL oracle lane fails
    # closed at EXECUTING_ORACLE ("oracle image identity is not
    # established"), so the deployed stack can never produce a verdict.
    # DOCKER_GID must match the group owning /var/run/docker.sock on the
    # host; the default 0 covers the standard root-owned socket.
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - edge
      - sandbox-calls
    # Single replica, hard caps. The app is single-writer SQLite +
    # in-process daemon workers: do NOT add replicas.
    # (Flat mem_limit/cpus: enforced without swarm mode. Do not add a
    # deploy.resources block alongside them — compose rejects duplicates.)
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=1g
    read_only: false # must stay writable: SQLite + per-app workspaces live here
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    # Pinned by digest 2026-10-08 (workstream-5). Same as 1.27-alpine.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx/systemaops.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificate + key (provisioned out of band — certbot/ACME or
      # your CA; never committed). Container fails to start without them,
      # which is intentional: no plaintext fallback in production.
      - ${TLS_CERT_PATH:-./deployment/tls/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./deployment/tls/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
      # Optional: prebuilt frontend (npm run build output) served as static files.
      - ${FRONTEND_DIST_PATH:-./frontend/dist}:/usr/share/nginx/html:ro
    networks:
      - edge
    # Flat mem_limit: enforced without swarm mode.
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null https://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    name: systemaops-edge
  # Separate network object documents that sandbox containers run on the
  # host daemon with --network none (they are NOT attached here).
  sandbox-calls:
    name: systemaops-sandbox-calls

volumes:
  control-plane-data:
    name: systemaops-control-plane-data
  control-plane-work:
    name: systemaops-control-plane-work
