[pytest]
# Root pytest configuration (audit D-5).
#
# Before this file existed the suite had no central marker registration,
# no testpaths and no norecursedirs, so a bare `pytest` from the repo
# root walked gitignored scratch trees (tmp/codex-pytest-*) and aborted
# with collection PermissionErrors, and any typo'd marker silently
# matched nothing instead of failing.
testpaths = tests
norecursedirs =
    tmp
    test-artifacts
    .venv
    .venv-audit
    node_modules
    build
    dist
addopts =
    --strict-markers
