[pytest]
# Root pytest configuration — reconciled from main (a923c65/a923c65) and
# codex/universal-core (audit D-5).  Single source of truth: markers from
# main, strict collection discipline from codex.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

norecursedirs =
    tmp
    test-artifacts
    .venv
    .venv-audit
    node_modules
    build
    dist

markers =
    docker: marks tests as requiring Docker (skip if Docker unavailable)
    integration: marks tests as integration tests (may require external services)
    slow: marks tests as slow
    unit: marks tests as unit tests
    skipif_no_docker: skip test if Docker daemon is unavailable

addopts =
    -p no:cacheprovider
    --strict-markers
    --tb=short
    -ra

minversion = 3.9

filterwarnings =
    ignore::DeprecationWarning
